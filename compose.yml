services:
  ganger:
    image: node:20-alpine
    container_name: ganger
    working_dir: /app
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm start -- --host 0.0.0.0"
    restart: unless-stopped

volumes:
  node_modules:
