<div class="wrapper">
  <main>
    <div class="column">
      @for (question of questionColumn; track question) {
        <button type="button" class="item" [class.selected]="isQuestionSelected(question)"
          [class.correct-selected]="isDone(question)" [class.wrong-selected]="isQuestionWrong(question)"
          [attr.aria-pressed]="isQuestionSelected(question)" (click)="selectQuestion(question)">
          <!-- Tecknet säger samma sak som färgen, för den som inte skiljer
               grönt från rött. -->
          @if (isDone(question)) {
            <span class="item-mark" aria-hidden="true">✓</span><span class="ui-visually-hidden">Rätt: </span>
          } @else if (isQuestionWrong(question)) {
            <span class="item-mark" aria-hidden="true">✗</span><span class="ui-visually-hidden">Fel: </span>
          }
          {{ questionText(question) }}
        </button>
      }
    </div>
    <div class="column">
      @for (question of answerColumn; track question) {
        <button type="button" class="item" [class.selected]="isAnswerSelected(question)"
          [class.correct-selected]="isDone(question)" [class.wrong-selected]="isAnswerWrong(question)"
          [attr.aria-pressed]="isAnswerSelected(question)" (click)="selectAnswer(question)">
          @if (isDone(question)) {
            <span class="item-mark" aria-hidden="true">✓</span><span class="ui-visually-hidden">Rätt: </span>
          } @else if (isAnswerWrong(question)) {
            <span class="item-mark" aria-hidden="true">✗</span><span class="ui-visually-hidden">Fel: </span>
          }
          {{ answerText(question) }}
        </button>
      }
    </div>
  </main>
  <div class="bottom">
    @if (isRoundComplete()) {
      <button type="button" class="ui-btn ui-btn--primary" (click)="nextRound()">Nästa</button>
    }
  </div>
</div>
