@if (screen === 'menu') {
  <main class="menu">
    <h1 class="title">Gånger</h1>
    <p class="lead">Välj spel</p>
    <button type="button" class="choice" (click)="play('match')">
      <span class="choice-name">Para ihop</span>
      <span class="choice-hint">Matcha frågan med rätt svar</span>
    </button>
    <button type="button" class="choice" (click)="play('swipe')">
      <span class="choice-name">Svep</span>
      <span class="choice-hint">Svep höger om påståendet stämmer</span>
    </button>
    <button type="button" class="choice" (click)="play('master')">
      <span class="choice-name">Mästaren</span>
      <span class="choice-hint">Skriv svaret på tid — nivåer och värmekarta</span>
    </button>
  </main>
} @else {
  <div class="game">
    <button type="button" class="back" (click)="showMenu()">← Meny</button>
    @switch (screen) {
      @case ('match') { <app-match-view /> }
      @case ('swipe') { <app-swipe-view /> }
      @case ('master') { <app-master-view /> }
    }
  </div>
}
